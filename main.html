<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move File </title>

    <!-- Gerekli Lottie scriptleri -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-interactivity@latest/dist/lottie-interactivity.min.js"></script>

    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .animation-container {
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Basit Animasyon -->
        <div class="section">
            <h2>Basit Animasyon</h2>
            <div class="animation-container">
                <lottie-player
                    src="https://assets9.lottiefiles.com/packages/lf20_M9p23l.json"
                    background="transparent"
                    speed="1"
                    style="width: 100%; height: 100%;"
                    loop
                    autoplay>
                </lottie-player>
            </div>
        </div>

        <!-- Etkileşimli Animasyon -->
        <div class="section">
            <h2>Etkileşimli Animasyon</h2>
            <div class="animation-container" id="hover-animation">
                <lottie-player
                    id="hover-player"
                    src="https://assets3.lottiefiles.com/packages/lf20_UJNc2t.json"
                    background="transparent"
                    speed="1">
                </lottie-player>
            </div>
        </div>

        <!-- Loading Animasyonu -->
        <div class="section">
            <h2>Loading Animasyonu</h2>
            <div class="animation-container">
                <lottie-player
                    src="https://assets9.lottiefiles.com/packages/lf20_p8bfn5to.json"
                    background="transparent"
                    speed="1"
                    style="width: 100%; height: 100%;"
                    loop
                    autoplay>
                </lottie-player>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            LottieInteractivity.create({
                player: '#hover-player',
                mode: 'cursor',
                actions: [{
                    type: 'hover',
                    forceFlag: false
                }]
            });
        });
    </script>
</body>
</html>
